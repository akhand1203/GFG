name: Upload Old GFG Submissions

on:
  workflow_dispatch:

jobs:
  upload-submissions:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GFG submissions
        env:
          GFG_USERNAME: ${{ secrets.GFG_USERNAME }}
          GFG_CSRF_TOKEN: ${{ secrets.GFG_CSRF_TOKEN }}
          GFG_SESSION_TOKEN: ${{ secrets.GFG_SESSION_TOKEN }}
        run: python fetch_gfg.py

      - name: Commit and push solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add solutions/
          git diff --cached --quiet || git commit -m "chore: add old GFG submissions [skip ci]"
          git push
